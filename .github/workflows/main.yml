name: Build and Deploy Lambda

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'sesion5_github_lf_2026.csproj'
  LAMBDA_HANDLER: 'sesion5_github_lf_2026::sesion5_github_lf_2026.Function::FunctionHandler'
  LAMBDA_RUNTIME: 'dotnet8'

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --no-restore --configuration Release

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} --no-build --configuration Release --output ./publish

      - name: Zip artifact
        run: |
          cd publish
          zip -r ../app.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: app.zip
          retention-days: 5

  deploy-aws:
    runs-on: ubuntu-latest
    needs: build-package
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    env:
      LAMBDA_FUNCTION_NAME: ${{ github.ref == 'refs/heads/main' && vars.AWS_LAMBDA_FUNCTION_NAME_PROD || vars.AWS_LAMBDA_FUNCTION_NAME_DEV }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-package

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gh-actions-${{ github.run_id }}

      - name: Deploy Lambda
        run: |
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --handler "${{ env.LAMBDA_HANDLER }}" \
            --runtime "${{ env.LAMBDA_RUNTIME }}"
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file fileb://app.zip
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION_NAME"
